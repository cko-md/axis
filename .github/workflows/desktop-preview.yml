name: Desktop Preview

on:
  push:
    tags:
      - "desktop-preview-v*"

permissions:
  contents: write

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: false

env:
  AXIS_DESKTOP_PRODUCTION_URL: "https://axis-cko.vercel.app"
  AXIS_DESKTOP_SENTRY_DSN: ${{ secrets.AXIS_DESKTOP_SENTRY_DSN }}
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm ci --prefix electron
      - name: Validate preview isolation
        run: npm run desktop:check && npm run desktop:check:current && npm run desktop:preview:validate
      - name: Audit desktop runtime dependencies
        run: npm audit --prefix electron --audit-level=high

  mac:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm ci --prefix electron
      - name: Build ad-hoc-signed macOS preview
        run: npm run desktop:dist -- --mac --x64 --arm64 --publish never
      - name: Verify every fuse wire and the ad-hoc preview signature
        run: |
          npm run desktop:verify:fuses -- dist-electron
          npm run desktop:verify:signature -- --preview dist-electron
          npm run desktop:size:check
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-preview-mac
          if-no-files-found: error
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm ci --prefix electron
      - name: Build unsigned Windows preview
        run: npm run desktop:dist -- --win --x64 --publish never
      - name: Verify every Windows fuse wire
        run: npm run desktop:verify:fuses -- dist-electron
      - name: Prove Windows preview is unsigned
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem dist-electron -File -Filter "AXIS-*.exe"
            Get-ChildItem dist-electron/win-unpacked -File -Filter "AXIS.exe"
          )
          if ($files.Count -lt 2) {
            throw "Expected both the AXIS application and installer executables"
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -eq "Valid") {
              throw "Unexpected signed preview executable: $($file.Name)"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-preview-windows
          if-no-files-found: error
          path: dist-electron/*.exe

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm ci --prefix electron
      - name: Build Linux preview
        run: npm run desktop:dist -- --linux --x64 --publish never
      - name: Verify every Linux fuse wire
        run: npm run desktop:verify:fuses -- dist-electron
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-preview-linux
          if-no-files-found: error
          path: dist-electron/*.AppImage

  publish:
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-preview-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish clearly labeled preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AXIS Desktop Preview ${GITHUB_REF_NAME#desktop-preview-v}" \
            --notes-file - \
            --prerelease \
            --verify-tag <<'EOF'
          ## Evaluation build

          This preview is intentionally **not production-signed or notarized**.

          - macOS is ad-hoc signed so Apple Silicon can launch the fuse-hardened
            app, but carries no Developer ID certificate, team, or notarization
            ticket. Gatekeeper will warn or block normal launch.
          - Windows SmartScreen may show an unknown-publisher warning.
          - Production auto-update is disabled until the signed `desktop-v*` wave.
          - No `latest*.yml` or differential-update metadata is published with this preview.
          - Use only for controlled evaluation; do not distribute as a production release.

          Apple Developer ID signing/notarization, Windows Azure Artifact
          Signing, and the signed update channel remain in the production wave.
          EOF
